name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # .env.sample과 동일한 로컬 개발 전용 값 (운영 비밀정보 아님, 팀 공유 기본값)
    # .env.sample이 바뀌면 이 값도 함께 맞춰야 한다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: fitwallet
          MYSQL_USER: fitwallet
          MYSQL_PASSWORD: fitwallet1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot1234"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up DB (KST + schema + seed)
        uses: ./.github/actions/setup-db

      # 프로파일 기본값이 local이라 별도 설정 복사 단계가 필요 없다.
      # (src/main/resources/config/application-local.properties가 위 서비스와 짝이 맞는다)
      - name: Build with Gradle (compile + test + package)
        run: ./gradlew build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  # 프론트엔드가 읽는 OpenAPI 스펙을 develop 머지 시점에 openapi-spec 브랜치로 발행한다.
  #
  # 왜 저장소 트리에 커밋하지 않는가 — develop은 룰셋으로 보호돼 있어(PR 필수) GITHUB_TOKEN이
  # 직접 push할 수 없고, 뚫으려면 배포 키나 PAT 같은 자격증명을 만들어 보호를 완화해야 한다.
  # 보호가 없는 전용 브랜치에 발행하면 기본 토큰으로 충분하다.
  # PR 브랜치에 커밋을 얹는 방법도 되지만, 봇 커밋 뒤에 팀원이 매번 `git pull`을 해야 해서 접었다.
  openapi-spec:
    needs: build   # 빌드가 깨진 커밋의 스펙을 발행하지 않는다
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    permissions:
      contents: write   # openapi-spec 브랜치에 push한다

    # build 잡과 같은 값이다. services는 잡 사이에 공유할 수 없어 불가피하게 중복된다
    # (준비 스텝은 .github/actions/setup-db로 빼서 공유한다).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: fitwallet
          MYSQL_USER: fitwallet
          MYSQL_PASSWORD: fitwallet1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot1234"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up DB (KST + schema + seed)
        uses: ./.github/actions/setup-db

      # 앱을 띄워 /v3/api-docs를 받아 docs/openapi.json에 쓴다 (Gretty가 기동·종료를 처리).
      # 이 파일은 .gitignore 대상이라 워크스페이스에만 존재한다.
      - name: Generate OpenAPI spec
        run: ./gradlew openapiDump

      # openapi-spec 브랜치는 소스가 아니라 발행물이다. 저장소 트리와 섞이지 않도록
      # 워크스페이스 밖의 빈 저장소에서 만들어 push한다.
      # 이력은 남긴다 — 스펙 커밋 목록이 곧 API 계약 변경 이력이고, 전용 브랜치로 옮기면서
      # 잃은 "PR diff에서 계약 변화 확인"을 대신한다.
      - name: Publish spec to openapi-spec branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          spec=$(mktemp)
          cp docs/openapi.json "$spec"

          work=$(mktemp -d)
          cd "$work"
          git init -q -b openapi-spec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # 브랜치가 이미 있으면 그 위에 쌓는다. 최초 실행이면 새로 만든다.
          if git fetch -q --depth 1 origin openapi-spec 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
          fi

          cp "$spec" openapi.json
          cat > README.md <<'MD'
          # openapi-spec

          **이 브랜치는 CI가 만든다. 직접 고치지 않는다.**

          `develop`에 머지될 때마다 백엔드를 띄워 `/v3/api-docs`를 받아 `openapi.json`으로 발행한다
          (`.github/workflows/ci.yml`의 `openapi-spec` 잡). 소스는 `develop`에 있다.

          프론트엔드는 이 URL을 API 계약의 정본으로 읽는다:

          ```
          https://raw.githubusercontent.com/heartbeat-kb-town/fitwallet-backend/openapi-spec/openapi.json
          ```
          MD

          git add openapi.json README.md
          if git rev-parse --verify -q HEAD >/dev/null && git diff --cached --quiet; then
            echo "스펙 변화 없음 — 발행할 것이 없다."
            exit 0
          fi
          echo "스펙이 바뀌었다. openapi-spec 브랜치에 발행한다."
          git commit -q -m "chore: OpenAPI 스펙 갱신 (develop@${GITHUB_SHA:0:7})"
          git push -q origin openapi-spec
          echo "발행 완료."
