# 시연 프로파일. -Denv=demo 로 기동할 때 로드된다.
#
# EB 환경 fitwallet-demo(= develop 브랜치 자동 배포 대상)가 이 프로파일을 쓴다.
# 운영(fitwallet-prod / main / 성능 레인)은 여전히 application-prod.properties를 쓴다 —
# 이 파일을 추가해도 운영 동작은 하나도 바뀌지 않는다.
#
# prod와 같은 점: 접속 정보를 리터럴로 적지 않고 환경변수만 참조한다.
# prod와 다른 점: db/seed-local을 함께 적재한다 (아래).
#
# 배포 서버에 필요한 환경변수: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET

jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=${DB_URL}
jdbc.username=${DB_USERNAME}
jdbc.password=${DB_PASSWORD}

jdbc.pool.maximumPoolSize=20
jdbc.pool.minimumIdle=5
jdbc.pool.connectionTimeout=3000

# Flyway — 앱 기동 시 스키마와 시드를 적용한다.
#
# 운영과 달리 db/seed-local(V900번대)을 포함한다. 시연에는 데모 페르소나(user_id=1)가
# 있어야 하고, 이 환경에는 지켜야 할 실사용자 데이터가 없기 때문이다.
# 시드가 V900번대라 스키마보다 뒤에 적용되며, 그 뒤에 낮은 번호가 합류하는 것은
# FlywayMigrator의 outOfOrder(true)가 허용한다.
flyway.locations=classpath:db/migration,classpath:db/seed-local

# 빈 DB에서 시작하므로 baseline을 찍지 않고 V1부터 전부 실행된다.
# (baselineOnMigrate는 이력 테이블이 없고 스키마가 비어 있으면 동작하지 않는다.)
flyway.baseline-version=2

# 빈 값이면 Asia/Seoul 기준 시스템 시각을 사용한다.
# V901__benefit_demo_data.sql이 NOW() 기준 상대 날짜로 데이터를 넣으므로,
# 시각을 과거로 고정하면 리포트가 그 데이터를 못 본다. 그래서 비워 둔다.
clock.fixed-date=

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-millis=1800000
jwt.refresh-token-expiration-millis=1209600000

cookie.refresh-token-secure=true
