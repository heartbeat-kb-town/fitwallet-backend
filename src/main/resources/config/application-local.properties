# 로컬 개발 프로파일 (기본값). -Denv 를 지정하지 않으면 이 파일이 로드된다.
#
# 기본값은 .env.sample이 만드는 로컬 MySQL 컨테이너와 짝이 맞는다.
# 로컬 전용 값이라 운영 비밀정보가 아니므로 저장소에 그대로 커밋한다.
#
# ${MYSQL_*:기본값} 형태라, .env에서 포트나 계정을 바꾼 개발자는 아무것도 손대지 않아도 된다.
# build.gradle이 .env를 읽어 시스템 프로퍼티로 넘겨주므로 그 값이 아래 기본값을 덮어쓴다.

jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fitwallet}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
jdbc.username=${MYSQL_USER:fitwallet}
jdbc.password=${MYSQL_PASSWORD:fitwallet1234}

jdbc.pool.maximumPoolSize=10
jdbc.pool.minimumIdle=2
jdbc.pool.connectionTimeout=3000
