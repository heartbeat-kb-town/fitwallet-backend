# 성능 측정 프로파일. -Denv=perf 로 기동할 때 로드된다.
#
# 이 프로파일의 존재 이유는 하나다 — 팀원의 개발 DB와 성능 측정용 DB를 구조로 분리하는 것.
# 같은 스키마 위에 다른 데이터가 올라간다. 성능 데이터는 store 272만·payment_transaction 540만
# 규모라 개발 DB에 섞이면 ./gradlew test의 매퍼 통합테스트 전제(user_id=1, 카드 9건, 거래 391건)가
# 깨지고 시연 데이터도 못 쓰게 된다.
#
# 로컬 성능 DB와 스테이징 RDS를 같은 파일로 커버한다. 호스트·포트만 환경변수로 뽑았다.
#
#   로컬     docker compose -f docker-compose.perf.yml up -d   (기본값 그대로 쓰면 된다)
#   스테이징  PERF_DB_HOST=... PERF_DB_PORT=3306 PERF_DB_USER=... PERF_DB_PASSWORD=...

jdbc.driver=com.mysql.cj.jdbc.Driver

# ⚠️ MYSQL_PORT를 재사용하면 안 된다. build.gradle이 .env 전체를 시스템 프로퍼티로 넘기므로
# (MYSQL_PORT=3307 등) 같은 이름을 쓰면 개발 DB 포트에 덮여 3308이 아닌 곳에 붙는다.
# 이름을 분리해 두면 .env를 고쳐도 성능 프로파일은 영향을 받지 않는다.
jdbc.url=jdbc:mysql://${PERF_DB_HOST:localhost}:${PERF_DB_PORT:3308}/${PERF_DB_NAME:fitwallet}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
jdbc.username=${PERF_DB_USER:fitwallet}
jdbc.password=${PERF_DB_PASSWORD:fitwallet1234}

# 부하 테스트에서 커넥션 풀이 병목이 되면 "DB가 느린 것"이 아니라 "풀이 작은 것"이 결론이 된다.
# 운영(20)보다 넉넉하게 잡아 측정 대상이 DB 쪽에 남게 한다.
jdbc.pool.maximumPoolSize=50
jdbc.pool.minimumIdle=10
jdbc.pool.connectionTimeout=3000

# Flyway — 스키마와 참조 데이터만 적용한다.
# db/seed-local을 넣지 않는다. 데모 회원·결제내역이 섞이면 측정에 노이즈가 된다.
# 이 프로파일에서 store는 V2의 244행만 있는 상태로 시작하고, 나머지는 LOAD DATA로 들어온다.
flyway.locations=classpath:db/migration
# 빈 볼륨에서는 쓰이지 않는다(V1부터 전부 실행된다). 이미 데이터가 있는 스테이징 RDS를
# 재사용할 때만 의미가 있다.
flyway.baseline-version=2

# 비워 두면 Asia/Seoul 시스템 시각을 쓴다.
# 로컬 프로파일처럼 고정하면 안 된다 — 생성된 paid_at이 "생성 시점 기준 최근 12개월"이라
# 시계를 과거로 고정하면 조회 구간이 데이터를 벗어난다.
clock.fixed-date=

jwt.secret=${JWT_SECRET:Zml0d2FsbGV0LWxvY2FsLWp3dC1zZWNyZXQta2V5ISE=}
jwt.access-token-expiration-millis=1800000
jwt.refresh-token-expiration-millis=1209600000

# 부하 생성기(k6)가 http로 붙는다.
cookie.refresh-token-secure=false
