# 운영 프로파일. -Denv=prod 로 기동할 때 로드된다.
#
# 값을 리터럴로 적지 않고 환경변수만 참조한다.
# 환경변수가 없으면 플레이스홀더가 해석되지 않아 기동 단계에서 실패한다 (의도된 동작).
# 즉 이 파일이 커밋돼 있어도 운영 접속 정보는 저장소에 남지 않는다.
#
# 배포 서버에 필요한 환경변수: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET

jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=${DB_URL}
jdbc.username=${DB_USERNAME}
jdbc.password=${DB_PASSWORD}

# 풀 크기 20 → 40 (2026-08-23). 100VU 실측에서 20이 병목으로 확인됐다.
#
# report_summary 974ms 요청의 트레이스를 쪼개면 SQL 합계가 57ms고 나머지 917ms가
# 쿼리 밖이었다. CPU도 GC도 아니다 — 부하 중 JVM CPU 10% · major GC 0 · minor 0.5~3‰다.
# 톰캣 스레드가 134개까지 늘어난 상태에서 커넥션 20개를 두고 줄을 선 것이다.
# HikariCP의 getConnection() 대기는 스팬으로 안 잡혀 핸들러 시간에 묻힌다.
#
# RDS 상한은 630이고 최대 사용이 23이었다(풀 20 + 관리 3). 30배 여유가 있는데
# 우리가 20에서 스스로 막고 있었다.
#
# ⚠️ "커넥션 풀 8은 반증됐다(20이 낫다)"는 기록이 있는데 그건 8 vs 20 비교였다.
#    그때의 교훈 — 공식은 '실행 중'을 세고 풀은 '붙들린 것'을 센다 — 은 오히려 지금과
#    맞는다. 붙들린 시간(대기 917ms)이 실행 시간(57ms)보다 훨씬 길다는 것이 트레이스로
#    보였기 때문이다.
#
# ⚠️ 이 값을 더 올리기 전에 CPU를 본다. m7g.large가 2 vCPU라 커넥션을 늘려도 CPU가
#    차면 처리량이 안 는다. 지금은 10%라 여유가 있다.
jdbc.pool.maximumPoolSize=40
jdbc.pool.minimumIdle=5
jdbc.pool.connectionTimeout=3000

# Flyway — 앱 기동 시 스키마를 적용한다.
# db/seed-local은 로드하지 않는다. 데모 회원·결제내역은 운영에 들어가면 안 된다.
flyway.locations=classpath:db/migration
# 운영 RDS는 2026-08-05 배포 시점(V2까지)으로 굳어 있다. 이력 테이블이 없으므로 첫 기동에서
# baseline을 V2로 찍고 V3부터 적용한다. V3 이후는 전부 멱등하라 실제 상태가 이보다 앞서 있어도
# (누가 손으로 돌렸더라도) 다시 실행되는 것뿐이라 안전하다.
flyway.baseline-version=2

# 빈 값이면 Asia/Seoul 기준 시스템 시각을 사용한다.
clock.fixed-date=

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-millis=1800000
jwt.refresh-token-expiration-millis=1209600000

cookie.refresh-token-secure=true
